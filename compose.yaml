services:
  mongodb:
    image: mongo:8
    container_name: easygenerator-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: easygenerator-mailpit
    restart: unless-stopped
    ports:
      # SMTP — the backend sends dev mail here
      - '1025:1025'
      # Web UI + API — read captured mail at http://localhost:8025
      - '8025:8025'

volumes:
  mongodb_data:
